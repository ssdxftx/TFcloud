server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://tfcloud:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /health/ {
        proxy_pass http://tfcloud:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://tfcloud:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite 产物带内容哈希，浏览器和 CDN 都可以永久缓存。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
        add_header CDN-Cache-Control "public, max-age=31536000, immutable";
        add_header Surrogate-Control "max-age=31536000";
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
        add_header CDN-Cache-Control "public, max-age=31536000, immutable";
        add_header Surrogate-Control "max-age=31536000";
        try_files $uri =404;
    }

    # 根目录静态文件没有哈希，CDN 缓存一天并允许后台刷新。
    location ~* ^/(favicon\.svg|og\.png|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=3600, s-maxage=86400, stale-while-revalidate=86400, stale-if-error=604800";
        add_header CDN-Cache-Control "public, max-age=86400, stale-while-revalidate=604800, stale-if-error=604800";
        add_header Surrogate-Control "max-age=86400";
        try_files $uri =404;
    }

    # SPA 入口必须回源校验，CDN 不缓存 HTML。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header CDN-Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
